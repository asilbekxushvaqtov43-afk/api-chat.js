<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asilbekning kontent AI yordamchisi</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--muted:#5a6785;--line:#d5dcea;--accent:#1d4ed8;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0e1424;--card:#172038;--ink:#eaf0ff;--muted:#9aa9cc;--line:#2a3658;--accent:#6c97ff;--accent-ink:#0e1424}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:1.15rem;margin:0}
header p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
form{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
textarea{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;height:46px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <header><h1>Kontent AI yordamchisi</h1><p>Telegram va Instagram uchun g'oyalar</p></header>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" placeholder="G'oyangizni yozing..." aria-label="Xabar"></textarea>
    <button id="b" type="submit">Yuborish</button>
  </form>
</div>
<script>
var log=document.getElementById("log"),f=document.getElementById("f"),t=document.getElementById("t"),b=document.getElementById("b");
var hist=[];
function add(cls,txt){var d=document.createElement("div");d.className="m "+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add("bot","Salom! Qanday kontent g'oyalaring bor?");
f.addEventListener("submit",async function(e){
  e.preventDefault();
  var v=t.value.trim();
  if(!v)return;
  t.value="";b.disabled=true;
  hist.push({role:"user",content:v});
  add("me",v);
  var bubble=add("bot","Yozmoqda...");
  try{
    var r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:hist})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||"xato");
    bubble.textContent=d.text;
    hist.push({role:"assistant",content:d.text});
  }catch(err){
    hist.pop();
    bubble.textContent="Xatolik bo'ldi. Birozdan keyin qayta yozing.";
  }
  b.disabled=false;
  log.scrollTop=log.scrollHeight;
});
</script>
</body>
</html>
